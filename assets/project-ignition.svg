<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Project Ignition: classified</title>
  <desc id="d">A stealth-mode platform set to change how Egypt buys and sells cars. Brand and launch date are under wraps. Four of five milestones are complete.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#fff" stroke-opacity=".06"/></pattern>
    <radialGradient id="m" cx="1" cy="0" r="1"><stop stop-color="#fff"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gm"><rect width="1200" height="360" fill="url(#m)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; letter-spacing: 2.2px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #e2e8f0; }
    .h { font-size: 34px; font-weight: 800; fill: #fff; letter-spacing: -.8px; }
    .p { font-size: 15px; fill: #ffffff; fill-opacity: .62; }
    .k { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #ffffff; fill-opacity: .4; letter-spacing: 1px; }
    .v { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #ffffff; fill-opacity: .85; }
    .row { font-size: 14px; fill: #ffffff; fill-opacity: .82; }
    .fade { opacity: 0; animation: up .8s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .redact { animation: shimmer 2.2s ease-in-out infinite; }
    @keyframes shimmer { 0%,100% { opacity: .12 } 50% { opacity: .3 } }
    .ping { transform-origin: 98px 62px; animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .8 } 75%,100% { transform: scale(2.8); opacity: 0 } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-120px) } to { transform: translateY(380px) } }
    .grow { transform-origin: 740px 0; animation: grow 1.6s .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @media (prefers-reduced-motion: reduce) { .fade, .redact, .ping, .scan, .grow { animation: none; opacity: 1 } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="#07090d"/>
    <rect width="1200" height="360" fill="url(#grid)" mask="url(#gm)"/>
    <circle cx="1120" cy="-20" r="200" fill="#fbbf24" fill-opacity=".22" filter="url(#blur)"/>
    <circle cx="160" cy="400" r="170" fill="#34d399" fill-opacity=".12" filter="url(#blur)"/>
    <rect class="scan" width="1200" height="110" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="27.5" stroke="#fff" stroke-opacity=".1"/>

  <g class="fade">
    <rect x="80" y="46" width="126" height="30" rx="15" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".45"/>
    <circle class="ping" cx="98" cy="62" r="3.5" fill="#fbbf24"/><circle cx="98" cy="62" r="3.5" fill="#fbbf24"/>
    <text x="110" y="65.5" class="mono" style="fill:#fcd34d;font-weight:700">CLASSIFIED</text>
    <rect x="216" y="46" width="186" height="30" rx="15" stroke="#fff" stroke-opacity=".16"/>
    <text x="309" y="65.5" text-anchor="middle" class="mono" style="fill:#fff;fill-opacity:.6">AUTOMOTIVE · EGYPT</text>
  </g>
  <text x="80" y="112" class="mono fade" style="fill:#fff;fill-opacity:.45;letter-spacing:1px;font-size:13px;animation-delay:.1s">// Project Ignition</text>
  <g class="fade" style="animation-delay:.2s">
    <text x="80" y="154" class="h">Something big is coming to how</text>
    <text x="80" y="194" class="h">Egypt buys and sells cars.</text>
  </g>
  <g class="fade" style="animation-delay:.35s">
    <text x="80" y="236" class="k">BRAND</text><rect class="redact" x="140" y="225" width="160" height="14" rx="3" fill="#fff"/>
    <text x="330" y="236" class="k">LAUNCH</text><rect class="redact" x="396" y="225" width="96" height="14" rx="3" fill="#fff"/>
    <text x="80" y="279" class="k">STACK</text><rect x="140" y="262" width="71.19999999999999" height="24" rx="5" stroke="#ffffff" stroke-opacity=".18"/><text x="175.6" y="278.5" text-anchor="middle" class="code">Next.js</text><rect x="219.2" y="262" width="63.599999999999994" height="24" rx="5" stroke="#ffffff" stroke-opacity=".18"/><text x="251" y="278.5" text-anchor="middle" class="code">NestJS</text><rect x="290.79999999999995" y="262" width="94" height="24" rx="5" stroke="#ffffff" stroke-opacity=".18"/><text x="337.79999999999995" y="278.5" text-anchor="middle" class="code">PostgreSQL</text><rect x="392.79999999999995" y="262" width="94" height="24" rx="5" stroke="#ffffff" stroke-opacity=".18"/><text x="439.79999999999995" y="278.5" text-anchor="middle" class="code">OpenSearch</text><rect x="494.79999999999995" y="262" width="63.599999999999994" height="24" rx="5" stroke="#ffffff" stroke-opacity=".18"/><text x="526.5999999999999" y="278.5" text-anchor="middle" class="code">BullMQ</text><rect class="redact" x="566.4" y="267" width="56" height="14" rx="3" fill="#fff"/>
    <text x="80" y="318" class="p">Built end to end: web, API, search engine and admin. Details under NDA until launch.</text>
  </g>

  <g class="fade" style="animation-delay:.3s">
    <rect x="720" y="46" width="400" height="272" rx="20" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".1"/>
    <text x="744" y="78" class="mono" style="fill:#fff;fill-opacity:.5">BUILD LOG</text>
    <text x="1096" y="78" text-anchor="end" class="code" style="fill-opacity:.6">4/5</text>
    <rect x="744" y="92" width="352" height="6" rx="3" fill="#fff" fill-opacity=".1"/>
    <rect class="grow" x="744" y="92" width="281.6" height="6" rx="3" fill="url(#bar)"/>
  </g>
    <g class="fade" style="animation-delay:0.5s"><circle cx="760" cy="128" r="9" fill="#34d399" fill-opacity=".15"/><path d="M755.5 128l3 3 5.5-6" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="780" y="133" class="row">Accounts &amp; security</text></g>
    <g class="fade" style="animation-delay:0.62s"><circle cx="760" cy="158" r="9" fill="#34d399" fill-opacity=".15"/><path d="M755.5 158l3 3 5.5-6" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="780" y="163" class="row">Verified listings &amp; media</text></g>
    <g class="fade" style="animation-delay:0.74s"><circle cx="760" cy="188" r="9" fill="#34d399" fill-opacity=".15"/><path d="M755.5 188l3 3 5.5-6" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="780" y="193" class="row">Search engine</text></g>
    <g class="fade" style="animation-delay:0.86s"><circle cx="760" cy="218" r="9" fill="#34d399" fill-opacity=".15"/><path d="M755.5 218l3 3 5.5-6" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="780" y="223" class="row">Publishing &amp; discovery</text></g>
    <g class="fade" style="animation-delay:0.98s"><circle cx="760" cy="248" r="9" stroke="#fbbf24" stroke-opacity=".6" stroke-dasharray="3 2.5" fill="none"/><rect class="redact" x="780" y="241" width="150" height="13" rx="3" fill="#ffffff"/></g>
</svg>
