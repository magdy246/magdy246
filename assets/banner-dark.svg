<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Magdy Abu El-nour: Full-Stack Web Developer</title>
  <desc id="d">Full-Stack Web Developer working with React, Next.js, TypeScript, Laravel, WordPress. Currently Frontend &amp; WordPress Developer at Neea Studios Ltd · UK.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#07090d"/><stop offset="1" stop-color="#0b1017"/></linearGradient>
    <linearGradient id="brand" x1="80" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"><animate attributeName="stop-color" values="#34d399;#38bdf8;#34d399" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#34d399;#38bdf8" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
    <radialGradient id="fade" cx="0.7" cy="0" r="1"><stop stop-color="#fff"/><stop offset="0.75" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gridMask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 2.4px; font-size: 12px; fill: #94a3b8; }
    .name { font-size: 76px; font-weight: 800; letter-spacing: -2px; fill: #f3f6fa; }
    .grad { fill: url(#brand); }
    .title { font-size: 22px; font-weight: 600; fill: #f3f6fa; opacity: .82; }
    .chip { font-size: 13px; font-weight: 600; fill: #f3f6fa; }
    .role { font-size: 17px; font-weight: 700; fill: #f3f6fa; }
    .note { font-size: 13px; fill: #94a3b8; }
    .fade { opacity: 0; animation: up .9s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s } .d4 { animation-delay: .55s } .d5 { animation-delay: .7s } .d6 { animation-delay: .85s }
    @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .ping { transform-origin: 98px 66px; animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7 } 75%, 100% { transform: scale(2.6); opacity: 0 } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    .redact { animation: shimmer 2.4s ease-in-out infinite; }
    @keyframes shimmer { 0%,100% { opacity: .35 } 50% { opacity: .7 } }
    @media (prefers-reduced-motion: reduce) { .fade, .ping, .float, .redact { animation: none; opacity: 1 } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
    <circle cx="980" cy="-10" r="190" fill="#34d399" fill-opacity=".22" filter="url(#blur)"/>
    <circle cx="1160" cy="330" r="160" fill="#38bdf8" fill-opacity=".16" filter="url(#blur)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="27.5" stroke="#ffffff" stroke-opacity="0.1"/>

  <g class="fade d1">
    <rect x="80" y="50" width="275.6" height="32" rx="16" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".35"/>
    <circle class="ping" cx="98" cy="66" r="4" fill="#34d399"/>
    <circle cx="98" cy="66" r="4" fill="#34d399"/>
    <text x="112" y="70.5" class="mono" style="fill:#34d399;font-size:11px;font-weight:700">AVAILABLE FOR NEW PROJECTS</text>
  </g>
  <text x="76" y="156" class="name fade d2">Magdy</text>
  <text x="76" y="230" class="name grad fade d3">Abu El-nour</text>
  <text x="80" y="274" class="title fade d4">Full-Stack Web Developer</text>
  <g class="fade d5"><rect x="80" y="294" width="70" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/><text x="115" y="314" text-anchor="middle" class="chip">React</text></g>
  <g class="fade d5"><rect x="160" y="294" width="86.80000000000001" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/><text x="203.4" y="314" text-anchor="middle" class="chip">Next.js</text></g>
  <g class="fade d5"><rect x="256.8" y="294" width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/><text x="312.8" y="314" text-anchor="middle" class="chip">TypeScript</text></g>
  <g class="fade d5"><rect x="378.8" y="294" width="86.80000000000001" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/><text x="422.20000000000005" y="314" text-anchor="middle" class="chip">Laravel</text></g>
  <g class="fade d5"><rect x="475.6" y="294" width="103.60000000000001" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/><text x="527.4" y="314" text-anchor="middle" class="chip">WordPress</text></g>

  <g class="float">
    <g class="fade d5">
      <rect x="770" y="58" width="376" height="128" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="794" y="84" width="44" height="44" rx="12" fill="#ffffff" stroke="#0f172a" stroke-opacity=".08"/>
      <path d="M806 120v-12a10 10 0 0 1 20 0v12h-5v-12a5 5 0 0 0-10 0v12z M804 123h24v2.5h-24z" fill="#1b4a6b"/>
      <text x="856" y="96" class="mono" style="font-size:10.5px">CURRENTLY</text>
      <text x="856" y="118" class="role">Frontend &amp; WordPress Developer</text>
      <text x="856" y="138" class="note">Neea Studios Ltd · UK</text>
      <text x="794" y="166" class="note">Building Polimapper, a geospatial SaaS</text>
    </g>
    <g class="fade d6">
      <rect x="770" y="202" width="376" height="96" rx="20" fill="#fbbf24" fill-opacity=".07" stroke="#fbbf24" stroke-opacity=".4" stroke-dasharray="6 5"/>
      <text x="794" y="232" class="mono" style="fill:#fbbf24;font-size:10.5px;font-weight:700">● NEXT · CLASSIFIED</text>
      <text x="794" y="257" class="role">Project Ignition</text>
      <rect class="redact" x="960" y="244" width="130" height="16" rx="4" fill="#94a3b8"/>
      <text x="794" y="280" class="note">Automotive · Egypt · classified</text>
    </g>
  </g>
</svg>
