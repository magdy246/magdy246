name: Update contribution calendar

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate live contribution calendar
        env:
          GITHUB_USERNAME: magdy246
        run: node scripts/update-contributions.mjs

      - name: Commit updated calendar
        shell: bash
        run: |
          if git diff --quiet -- assets/github-contributions.svg; then
            echo "Contribution calendar is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contributions.svg
          git commit -m "chore: update contribution calendar"
          git push
